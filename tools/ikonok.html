<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyxoria ikonok</title>
<style>
body{margin:0;background:#0f1330;color:#e8ecff;font:14px/1.4 system-ui,sans-serif;padding:16px}
h2{margin:18px 0 8px;font-size:16px;color:#cfd8ff}
.g{display:flex;flex-wrap:wrap;gap:10px}
.c{width:112px;text-align:center;font-size:11px;color:#a9b2d8}
.fr{width:96px;height:96px;margin:0 auto 4px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a3170,#12163a);border:2px solid #a9adc4;box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
.fr.zold{border-color:#6fd39a}.fr.kek{border-color:#6fa8ff}.fr.lila{border-color:#b48cff}
.fr svg{width:80px;height:80px}.sk{border-radius:18px;overflow:hidden;border:2px solid #e9c478;padding:0}.sk svg{width:100%;height:100%;display:block}
.small{display:flex;gap:6px;justify-content:center;margin-top:4px}.small svg{width:32px;height:32px}.small .x{width:20px;height:20px}
</style></head><body>
<h1 style="font-size:20px">Nyxoria ikonkészlet</h1><div id="out"></div>
<script src="../js/data.js"></script><script src="../js/icons.js"></script><script src="../js/icons-items.js"></script><script src="../js/icons-skills.js"></script><script src="../js/icons-w1.js"></script><script src="../js/icons-w2.js"></script><script src="../js/icons-gear.js"></script><script src="../js/icons-sk1.js"></script><script src="../js/icons-sk2.js"></script><script src="../js/icons-misc.js"></script>
<script>
const I=NYX.icons,D=NYX.data,out=document.getElementById('out'),rar=['','zold','kek','lila'];
function sec(t,kind,keys,isSk){out.insertAdjacentHTML('beforeend',`<h2>${t} (${keys.filter(x=>I.has(kind,x)).length}/${keys.length})</h2><div class="g">${keys.map((x,i)=>`<div class="c"><div class="fr ${isSk?'sk':rar[i%4]}">${I.has(kind,x)?I.svg(kind,x):'<span style="color:#f77">hiányzik</span>'}</div>${x}<div class="small">${I.svg(kind,x)}<span class="x">${I.svg(kind,x)}</span></div></div>`).join('')}</div>`)}
const W=[];Object.keys(D.ITEM_NAMES.fegyver).forEach(t=>W.push(...D.ITEM_NAMES.fegyver[t]));
sec('Fegyverek','item',W);
sec('Páncél','item',D.ITEM_NAMES.pancel);sec('Fejfedő','item',D.ITEM_NAMES.sisak);sec('Gyűrű','item',D.ITEM_NAMES.gyuru);sec('Amulett','item',D.ITEM_NAMES.amulett);
sec('Mitikus','item',D.MYTHIC_NAMES.map((_,i)=>'mitikus'+i));
D.CLASS_ORDER.forEach(c=>sec('Képességek – '+D.CLASSES[c].name,'skill',[D.CLASSES[c].basic,...D.CLASSES[c].skills],true));
sec('Egyéb','misc',['elet','tam','ved','fur','fakla','frissesseg','holdezust','csillagpor','tp','harcero','zsakmany','lada'],true);
</script></body></html>
